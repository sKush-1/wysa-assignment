services:
  postgres:
    image: postgres:17-alpine
    container_name: wysa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wysa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wysa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-wysa_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wysa} -d ${POSTGRES_DB:-wysa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
